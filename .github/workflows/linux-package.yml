name: Linux packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (empty = VERSION.json)"
        required: false
        type: string
      pkgrel:
        description: "Arch pkgrel (bump to rebuild the same version)"
        required: false
        default: "1"
        type: string
      publish:
        description: "Publish a GitHub Release"
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - "scripts/**"
      - "packaging/**"
      - "VERSION.json"
      - ".github/workflows/linux-package.yml"

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done

  package:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(python3 -c 'import json; print(json.load(open("VERSION.json"))["version"])')}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building AyuGram For Linux $VERSION"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates dpkg-dev flatpak ostree desktop-file-utils python3 xz-utils file

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/ci-package.sh

      - name: Check the .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          deb="dist/ayugram-desktop_${VERSION}_amd64.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E 'usr/bin/AyuGram|hicolor/256x256/apps/com.ayugram.desktop.png|metainfo'
          desktop-file-validate packaging/linux/com.ayugram.desktop.desktop

      - name: Smoke test the binary
        run: |
          file out/AyuGram
          ldd out/AyuGram
          if ldd out/AyuGram | grep "not found"; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error

  arch:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist

      - name: Build pacman package and repo
        env:
          VERSION: ${{ needs.package.outputs.version }}
          PKGREL: ${{ inputs.pkgrel || '1' }}
        run: |
          pacman -Syu --noconfirm --needed namcap
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          # Only the tarball is input; the rest of dist/ belongs to the other job.
          mkdir -p /tmp/in && mv dist/AyuGram-*-linux-x64.tar.xz /tmp/in/ && rm -rf dist
          chown -R builder: /tmp/in
          su builder -c "cd '$GITHUB_WORKSPACE' && VERSION='$VERSION' PKGREL='$PKGREL' bash ./scripts/package-arch.sh --tarball /tmp/in/AyuGram-${VERSION}-linux-x64.tar.xz --repo"
          ls -la dist

      - name: Check the package
        run: |
          namcap dist/PKGBUILD || true
          namcap dist/*.pkg.tar.zst || true
          pacman -U --noconfirm dist/*.pkg.tar.zst
          test -x /usr/bin/AyuGram
          if ldd /usr/bin/AyuGram | grep "not found"; then exit 1; fi
          pacman -Ql ayugram-for-linux-bin | grep -E 'applications|metainfo|dbus-1|256x256'

      - uses: actions/upload-artifact@v4
        with:
          name: arch-dist
          path: |
            dist/*.pkg.tar.zst
            dist/PKGBUILD
            dist/.SRCINFO
            dist/ayugram.db
            dist/ayugram.db.tar.gz
            dist/ayugram.files
            dist/ayugram.files.tar.gz
          include-hidden-files: true
          if-no-files-found: error

  release:
    needs: [package, arch]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          mv .SRCINFO SRCINFO 2>/dev/null || true
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: AyuGram For Linux ${{ needs.package.outputs.version }}
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Linux builds of **AyuGram Desktop ${{ needs.package.outputs.version }}**.

            | File | What it is |
            | --- | --- |
            | `ayugram-desktop_${{ needs.package.outputs.version }}_amd64.deb` | Linux Mint / Ubuntu / Debian |
            | `ayugram-for-linux-bin-${{ needs.package.outputs.version }}-*-x86_64.pkg.tar.zst` | Arch / Manjaro / EndeavourOS / CachyOS |
            | `ayugram.db`, `ayugram.files` | pacman repository (updates via `pacman -Syu`) |
            | `PKGBUILD` | for `makepkg -si` |
            | `AyuGram-${{ needs.package.outputs.version }}-x86_64.AppImage` | portable AppImage |
            | `AyuGram-${{ needs.package.outputs.version }}-linux-x64.tar.xz` | portable folder, any distro |
            | `ayugram-desktop-${{ needs.package.outputs.version }}.flatpak` | Flatpak bundle |
            | `SHA256SUMS` | checksums |

            ### Install (any distro, picks the right package)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/stillemptyNOW/AyuGram-For-Linux/main/scripts/install.sh | bash
            ```

            ### Linux Mint / Ubuntu / Debian

            ```bash
            sudo apt install ./ayugram-desktop_${{ needs.package.outputs.version }}_amd64.deb
            ```

            ### Arch Linux

            ```bash
            sudo pacman -U ./ayugram-for-linux-bin-${{ needs.package.outputs.version }}-*-x86_64.pkg.tar.zst
            ```

            or add the repo to `/etc/pacman.conf` to get updates with `pacman -Syu`:

            ```ini
            [ayugram]
            SigLevel = Optional TrustAll
            Server = https://github.com/stillemptyNOW/AyuGram-For-Linux/releases/latest/download
            ```

            The binary is the portable AyuGram Desktop build (static Qt, glibc ≥ 2.28) taken from the community Flatpak, so it runs on Mint 20+, Ubuntu 20.04+, Debian 11+ and current Arch.

            Upstream: https://github.com/AyuGram/AyuGramDesktop/releases/tag/v${{ needs.package.outputs.version }}
