name: Linux packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (empty = VERSION.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(python3 -c 'import json; print(json.load(open("VERSION.json"))["version"])')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building AyuGram For Linux $VERSION"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget ca-certificates dpkg-dev flatpak ostree desktop-file-utils python3 xz-utils file

      - name: Package Linux builds
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-linux-${{ steps.ver.outputs.version }}
          path: |
            dist/*
            out/AyuGram
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: AyuGram For Linux ${{ steps.ver.outputs.version }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Linux builds of **AyuGram Desktop ${{ steps.ver.outputs.version }}** for Linux Mint, Ubuntu, Debian and other distros.

            | File | What it is |
            | --- | --- |
            | `ayugram-desktop_${{ steps.ver.outputs.version }}_amd64.deb` | native package for Mint / Ubuntu / Debian |
            | `AyuGram-${{ steps.ver.outputs.version }}-x86_64.AppImage` | portable AppImage |
            | `AyuGram-${{ steps.ver.outputs.version }}-linux-x64.tar.xz` | portable folder |
            | `ayugram-desktop-${{ steps.ver.outputs.version }}.flatpak` | Flatpak bundle |

            ### Install on Linux Mint

            ```bash
            curl -fsSL https://raw.githubusercontent.com/stillemptyNOW/AyuGram-For-Linux/main/scripts/install.sh | bash
            ```

            Or download the `.deb` and run:

            ```bash
            sudo apt install ./ayugram-desktop_${{ steps.ver.outputs.version }}_amd64.deb
            ```

            Binary is the official AyuGram Desktop Linux build (same as the community Flatpak), packaged here for Debian-family distros.

            Upstream: https://github.com/AyuGram/AyuGramDesktop/releases/tag/v${{ steps.ver.outputs.version }}
          files: dist/*
