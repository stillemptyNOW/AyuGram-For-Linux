name: Check AyuGram upstream

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare with upstream and the community Flatpak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OURS="$(jq -r .upstream_tag VERSION.json)"
          LATEST="$(gh api repos/AyuGram/AyuGramDesktop/releases/latest --jq .tag_name || true)"
          echo "tracked=$OURS latest=$LATEST"
          if [ -z "$LATEST" ] || [ "$OURS" = "$LATEST" ]; then
            exit 0
          fi

          # Packages are cut from the community Flatpak; say whether it exists yet.
          FLATPAK_TAG="$(gh api 'repos/0FL01/AyuGramDesktop-flatpak/releases?per_page=50' \
            --jq "[.[] | select(.prerelease | not) | select(.tag_name | startswith(\"flatpak-${LATEST}-\"))][0].tag_name // empty")"
          if [ -n "$FLATPAK_TAG" ]; then
            FLATPAK_LINE="Community Flatpak is ready: https://github.com/0FL01/AyuGramDesktop-flatpak/releases/tag/${FLATPAK_TAG}"
          else
            FLATPAK_LINE="Community Flatpak for ${LATEST} is not published yet; packaging will fail until it is."
          fi

          TITLE="Upstream AyuGram ${LATEST} is out (we track ${OURS})"
          if [ "$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq length)" != "0" ]; then
            echo "issue already open"
            exit 0
          fi

          {
            echo "AyuGram Desktop released **${LATEST}**. Tracked in VERSION.json: **${OURS}**."
            echo
            echo "${FLATPAK_LINE}"
            echo
            echo "1. Set \`version\` / \`upstream_tag\` in VERSION.json to ${LATEST#v} / ${LATEST}."
            echo "2. Run the **Linux packages** workflow."
            echo
            echo "Upstream: https://github.com/AyuGram/AyuGramDesktop/releases/tag/${LATEST}"
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md
